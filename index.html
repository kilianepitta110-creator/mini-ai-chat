<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Mini AI Chat</h1>
    <p>Model: <span id="model-label">openrouter/free</span></p>

    <section>
      <label for="api-key">OpenRouter API key</label>
      <input type="password" id="api-key" placeholder="sk-or-...">
      <button type="button" id="save-key">Save</button>
      <button type="button" id="forget-key">Forget key</button>
      <p id="key-status" class="hint">No key saved.</p>
      <p class="hint">
        Your key is stored in this browser only. Your questions are sent to
        OpenRouter and its model provider. Use non-sensitive test data.
      </p>
    </section>

    <section>
      <h2>Conversation</h2>
      <button type="button" id="new-chat">New Chat</button>
      <button type="button" id="clear-history">Clear saved history</button>
      <div id="conversation">
        <p class="empty" id="empty-note">No messages yet. Save your key and ask a question.</p>
      </div>
      <p id="status" class="status">Status: Ready</p>
    </section>

    <form id="chat-form">
      <label for="question">Your question</label>
      <textarea id="question" rows="3" placeholder="Type a question..."></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
